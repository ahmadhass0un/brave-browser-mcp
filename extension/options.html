<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Navigator MCP Bridge — Settings</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #202124;
    --card: #292a2d;
    --border: #3c4043;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --accent: #8ab4f8;
    --ok: #81c995;
    --warn: #fdd663;
    --err: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 600px; padding: 28px 16px 48px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  header p { margin: 2px 0 20px; color: var(--muted); font-size: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* status row */
  .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.connected   { background: var(--ok); }
  .dot.reconnecting{ background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.disconnected{ background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #status-label { flex: 1 1 auto; min-width: 120px; }

  button {
    font: inherit;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(138,180,248,.12); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }

  #error-box {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(242,139,130,.08);
    border: 1px solid rgba(242,139,130,.35);
    border-radius: 8px;
  }
  #error-box pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: var(--err);
  }

  /* form fields */
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; margin-bottom: 6px; color: var(--muted); }
  .field em { font-style: normal; opacity: .7; }
  input[type="text"], input[type="url"], input[type="password"] {
    width: 100%;
    padding: 9px 12px;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  input:focus-visible { border-color: var(--accent); }
  input::placeholder { color: #5f6368; }

  /* toggle switch */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
  }
  .toggle-row small { display: block; color: var(--muted); font-size: 12px; }
  .switch { position: relative; flex: none; width: 40px; height: 22px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch i {
    position: absolute; inset: 0;
    background: var(--border); border-radius: 11px;
    transition: background .15s;
    pointer-events: none;
  }
  .switch i::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--fg);
    transition: transform .15s;
  }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(18px); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* browser info */
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; }

  #save-note {
    min-height: 18px;
    margin: 4px 2px 0;
    font-size: 12px;
    color: var(--ok);
    text-align: right;
    transition: opacity .4s;
  }

  @media (max-width: 480px) {
    main { padding: 16px 10px 32px; }
    .status-row button { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Browser Navigator <span>MCP Bridge</span></h1>
    <p>v<span id="ext-version">—</span> · settings are applied immediately</p>
  </header>

  <section class="card" aria-labelledby="conn-h">
    <h2 id="conn-h">Connection</h2>
    <div class="status-row">
      <span id="status-dot" class="dot" aria-hidden="true"></span>
      <span id="status-label">Checking…</span>
      <button id="reconnect-btn" type="button">Reconnect now</button>
    </div>
    <div id="error-box" hidden>
      <pre id="error-text"></pre>
    </div>
  </section>

  <section class="card" aria-labelledby="srv-h">
    <h2 id="srv-h">Server</h2>
    <label class="field">
      <span>WebSocket server URL</span>
      <input id="ws-url" type="text" spellcheck="false" autocomplete="off"
             placeholder="ws://127.0.0.1:9224">
    </label>
    <label class="field">
      <span>Pairing token <em>(optional)</em></span>
      <input id="pairing-token" type="password" spellcheck="false" autocomplete="off"
             placeholder="leave empty if the server has none">
    </label>
    <label class="toggle-row">
      <span>Prefer native messaging
        <small>Fallback transport when the WebSocket server is unreachable</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="prefer-native">
        <i aria-hidden="true"></i>
      </span>
    </label>
  </section>

  <section class="card" aria-labelledby="about-h">
    <h2 id="about-h">Browser</h2>
    <dl id="browser-info"></dl>
  </section>

  <p id="save-note" role="status" aria-live="polite"></p>
</main>
<script src="options.js"></script>
</body>
</html>
